name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Both platforms this app supports -- see requirements.txt's
    # Windows-only/macOS-only sections and docs/macos_setup.md. fail-fast
    # is off so a failure on one OS doesn't hide results from the other.
    runs-on: ${{ matrix.os }}
    # A hard backstop against a repeat of a real incident: macOS runs
    # silently hung for the full default 6-hour job limit (no single test
    # should ever legitimately take anywhere near that long), burning CI
    # minutes for hours with no useful log output. 20 minutes is generous
    # for install + the whole suite (a healthy run finishes in ~1-4
    # minutes) while still failing fast enough to actually investigate.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-timeout

      - name: Run tests
        # --timeout kills and reports any INDIVIDUAL test that runs past
        # 60s (thread-dumping where it was stuck first) rather than letting
        # one hung test silently consume the whole job's time budget --
        # the second layer of the same backstop as timeout-minutes above,
        # scoped to pinpoint which test rather than just which job.
        run: pytest tests/ -q --timeout=60 --timeout-method=thread
