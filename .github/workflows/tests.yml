name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Both platforms this app supports -- see requirements.txt's
    # Windows-only/macOS-only sections and docs/macos_setup.md. fail-fast
    # is off so a failure on one OS doesn't hide results from the other.
    runs-on: ${{ matrix.os }}
    # A hard backstop against a repeat of a real incident: macOS runs
    # silently hung for the full default 6-hour job limit (no single test
    # should ever legitimately take anywhere near that long), burning CI
    # minutes for hours with no useful log output. 20 minutes is generous
    # for install + the whole suite (a healthy run finishes in ~1-4
    # minutes) while still failing fast enough to actually investigate.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-timeout

      - name: Run tests
        # -v (not -q) so a hang's LAST STARTED test name is visible in the
        # log even if nothing else catches it -- confirmed necessary: a
        # prior run with --timeout-method=thread never fired at all (no
        # timeout message anywhere in the log, just dead silence until the
        # job-level timeout-minutes above killed it), meaning whatever
        # hangs holds the GIL solidly enough that pytest-timeout's
        # monitoring THREAD never even got scheduled to check. signal-based
        # timeout (SIGALRM, POSIX-only) can sometimes interrupt a blocking
        # call that a plain Python thread can't preempt, so macOS gets that
        # instead; Windows keeps thread method (it's never been the one
        # hanging, and SIGALRM doesn't exist there).
        run: pytest tests/ -v --timeout=60 --timeout-method=${{ matrix.os == 'macos-latest' && 'signal' || 'thread' }}
